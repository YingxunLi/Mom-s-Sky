<!DOCTYPE html>
<html lang="zh"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Klimu 别硬撑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: one phone-width column, Notion-like document page: figure left, body-part rows right, needs + controls below */
:root{
  --paper:#ffffff; --ink:#191919; --muted:#787774; --line:#e9e9e7; --hover:#f1f1ef;
  --pain:#e03e3e; --pain-soft:#fbe4e4; --ok:#0f7b6c; --ok-soft:#ddedea; --warn:#d9730d; --warn-soft:#faebdd;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --display:"Instrument Serif",Georgia,"Songti SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#191919; --ink:#e6e5e3; --muted:#9b9a97; --line:#2f2f2f; --hover:#252525;
  --pain:#ff7369; --pain-soft:#4a2a27; --ok:#4dab9a; --ok-soft:#24352f; --warn:#ffa344; --warn-soft:#3f2c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#191919; --ink:#e6e5e3; --muted:#9b9a97; --line:#2f2f2f; --hover:#252525;
  --pain:#ff7369; --pain-soft:#4a2a27; --ok:#4dab9a; --ok-soft:#24352f; --warn:#ffa344; --warn-soft:#3f2c1a; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.page{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.01em}
.brand small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.speed{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
.speed button{background:none;border:0;padding:4px 9px;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--hover);color:var(--ink);font-weight:600}

.clock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.clock .lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
.clock .t{font-family:var(--mono);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.go{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:8px 16px;font-weight:600;white-space:nowrap}
.go.off{background:none;color:var(--ink)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:6px;background:var(--warn-soft)}
.alert.bad{background:var(--pain-soft)}
.alert .ic{font-size:18px;line-height:1.3}
.alert p{margin:0;flex:1;min-width:0}
.alert b{display:block}
.alert span{font-size:13px;color:var(--muted)}
.alert button{border:0;background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;align-self:center}

.stage{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.fig{height:min(62vh,420px);min-height:330px;display:flex;justify-content:center}
.fig svg{height:100%;width:auto;overflow:visible}
.fig.shake svg{animation:shake 1.6s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.2deg)}40%{transform:rotate(1.2deg)}60%{transform:rotate(-.6deg)}80%{transform:rotate(.6deg)}}
.fig.happy svg{animation:hop .6s ease-out 2}
@keyframes hop{50%{transform:translateY(-10px)}}
.ln{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.fl{fill:var(--paper);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
.hair{fill:var(--ink);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
.cover{fill:var(--paper)}
.eye{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.mouth{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round}
.glow{transition:opacity .6s}
.spark{fill:none;stroke:var(--pain);stroke-width:1.4;stroke-linecap:round;transition:opacity .6s}
.spark.live{animation:flick .9s steps(2) infinite}
@keyframes flick{50%{transform:translate(.6px,-.6px)}}
.sweat{fill:var(--paper);stroke:var(--ink);stroke-width:.9}

.zones{display:flex;flex-direction:column;gap:2px;min-width:0}
.zone{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 8px;border-radius:6px;background:none;border:0;text-align:left;width:100%}
.zone:hover{background:var(--hover)}
.zone .nm{font-weight:600}
.zone .pc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);align-self:center}
.zone .pc.hot{color:var(--pain);font-weight:500}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pain);transition:width .6s}
.zone .ex{grid-column:1/-1;font-size:12px;color:var(--muted)}
.zone .ex u{text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}

.sec{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.needs{display:flex;flex-wrap:wrap;gap:8px}
.need{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 10px;background:none;font-size:13px}
.need em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.need.due{border-color:var(--pain);background:var(--pain-soft)}
.need.due em{color:var(--pain)}
.need b{font-weight:500;background:var(--hover);border-radius:4px;padding:2px 7px;font-size:12px}

.foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.foot button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* exercise sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet .hd .tag{font-size:12px;background:var(--pain-soft);color:var(--pain);border-radius:4px;padding:2px 8px;font-weight:600}
.close{border:0;background:none;color:var(--muted);font-size:14px;padding:4px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.05;margin:0;text-wrap:balance}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.safe{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note{display:flex;flex-direction:column;gap:6px}
.note label{font-size:12px;color:var(--muted)}
.note input{font:inherit;color:var(--ink);background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
.meter{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--line);stroke-width:8}
.ring .fg{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--mono);font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--muted)}
.status{font-weight:600}
.status.slow{color:var(--warn)}
.status.done{color:var(--ok)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.mini{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.mini .bar{flex:1;grid-column:auto}
.mini .bar i{background:var(--pain)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:none;border-radius:6px;padding:10px 16px;font-weight:600}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fallback{font-size:13px;background:var(--hover);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fallback p{margin:0}
.back{background:var(--ok-soft);border-radius:6px;padding:12px 14px}
.back span{font-size:12px;color:var(--muted);display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.stage{grid-template-columns:96px 1fr}.meter{grid-template-columns:1fr;justify-items:center;text-align:center}}

html,body{height:100%}
body{box-sizing:border-box;overflow:hidden;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}
.page{height:100%;gap:10px}
.stage{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
.fig{height:100%;min-height:0}
.zones{justify-content:center}
.zone.hot{background:var(--pain-soft)}
.clock{padding-bottom:8px}
.foot{border:0;padding:0;justify-content:flex-end}
.alert,.zone .ex,.sec,.clock .lab,.need b,#footNote,.sheet .hd .tag,.steps,.sheet .sub,.note label{display:none!important}
.sheet .in{gap:12px}.sheet h2{font-size:28px}
.ring{width:120px;height:120px}.meter{grid-template-columns:120px 1fr}
</style>

<div class="page">
  <div class="top">
    <div class="brand">Klimu</div>
    <div class="speed" role="group" aria-label="时间速度">
      <button id="sp1" aria-pressed="false">实时</button>
      <button id="sp60" aria-pressed="true">演示 ×60</button>

  </div>

  <div class="clock">

      <div class="lab" id="clockLab">已连续专注</div>

  <div class="alert" id="alert" hidden>
    <div class="ic" aria-hidden="true">⚠︎</div>
    <p><b id="alertT"></b><span id="alertS"></span></p>
    <button id="alertGo">去做</button>

  <div class="stage">
    <div class="fig" id="fig">
      <svg viewBox="-8 -4 96 332" aria-label="Klimu">
        <defs>

        <ellipse class="glow" id="g-chest" cx="39.6" cy="124" rx="15" ry="15" fill="url(#pg)" opacity="0"/>

    <div class="sec">身体需求</div>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="in">
    <div class="hd"><span class="tag" id="exTag">颈肩</span><button class="close" id="exClose">结束 ✕</button></div>
    <h2 id="exName">手臂前举过头</h2>
    <ol class="steps" id="exSteps"></ol>
    <div class="safe">1 下 计入 · 2 下 换边 · 3 连 太快</div>
    <div class="note">
      <label for="noteIn">回来后做什么</label>
      <input id="noteIn" type="text" placeholder="回来后做什么" autocomplete="off">
    </div>
    <div class="meter">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="ringFg" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg>
        <div class="num"><b id="repN">0</b><span id="repT">/ 6 次</span></div>
      </div>
      <div>
        <div class="status" id="exStatus">点「开始」后举起手机</div>
        <div class="sub" id="exSub"></div>
        <div class="mini"><span id="exZone">颈肩</span><div class="bar"><i id="exBar"></i></div><span id="exPc" style="font-family:var(--mono);font-variant-numeric:tabular-nums">72%</span></div>
      </div>
    </div>
    <div class="row">
      <button class="btn pri" id="exStart">开始</button>
    </div>
    <div class="fallback" id="fallback" hidden>
      <p><b>读不到传感器</b></p>
      <div><button class="btn" id="simRep">手动 +1</button></div>
    </div>
    <div class="back" id="backCard" hidden><span>接着做</span><b id="backTxt"></b></div>
  </div>
</div>

<script>
(function(){
const ZONES=[
  {id:'neck', nm:'颈肩', min:50, ex:'手臂前举过头', reps:6, det:'raise', gap:1800, steps:['慢举过头顶，再慢放'], sub:'颈肩'},
  {id:'waist', nm:'腰', min:65, ex:'举高侧弯', reps:6, det:'tilt', gap:1500, steps:['单手举高，左弯再右弯'], sub:'腰'},
  {id:'arms', nm:'手臂', min:85, ex:'手臂画大圈', reps:8, det:'circle', gap:1500, steps:['侧平举，向后画大圈'], sub:'手臂'},
  {id:'chest', nm:'胸口', min:75, ex:'扩胸打开', reps:8, det:'yaw', gap:1500, steps:['胸前平伸，向外打开再收回'], sub:'胸口'}
];
const NEEDS=[{id:'water',nm:'喝水',min:45,act:'喝了'},{id:'wc',nm:'上厕所',min:120,act:'去了'},{id:'food',nm:'吃饭',min:300,act:'吃了'}];
const $=id=>document.getElementById(id);
const store={get(){try{return JSON.parse(localStorage.getItem('klimu')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('klimu',JSON.stringify(v))}catch(e){}}};

function sample(){return {sample:true,focusing:false,speed:60,elapsed:48*60,pain:{neck:74,waist:56,arms:38,chest:31},need:{water:52*60,wc:95*60,food:150*60},note:''}}
let S=store.get()||sample();

/* ---------- time ---------- */
let last=performance.now();
function tick(){
  const now=performance.now(), dtReal=(now-last)/1000; last=now;
  if(S.focusing){
    const dt=dtReal*S.speed;
    S.elapsed+=dt;
    ZONES.forEach(z=>{S.pain[z.id]=Math.min(100,S.pain[z.id]+dt/(z.min*60)*100)});
    NEEDS.forEach(n=>{S.need[n.id]+=dt});
  }
  render();
}
setInterval(tick,250);
setInterval(()=>store.set(S),2000);

function fmt(sec){sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function ago(sec){const m=Math.floor(sec/60);return m<60?m+' 分钟':Math.floor(m/60)+' 小时 '+(m%60)+' 分'}

/* ---------- build ---------- */
const zoneEls={};
ZONES.forEach(z=>{
  const b=document.createElement('button');b.className='zone';b.id='z-'+z.id;
  b.innerHTML=`<span class="nm">${z.nm}</span><span class="pc"></span><span class="bar"><i></i></span><span class="ex">去做：<u>${z.ex}</u></span>`;
  b.onclick=()=>openEx(z);$('zones').appendChild(b);
  zoneEls[z.id]={b,pc:b.querySelector('.pc'),bar:b.querySelector('.bar i')};
});
const needEls={};
NEEDS.forEach(n=>{
  const b=document.createElement('button');b.className='need';
  b.innerHTML=`${n.nm} <em></em><b>${n.act}</b>`;
  b.onclick=()=>{S.need[n.id]=0;render()};
  $('needs').appendChild(b);needEls[n.id]={b,em:b.querySelector('em')};
});

let faceMode='';
function setFace(mode){
  if(mode===faceMode)return;faceMode=mode;
  const f={
    calm:'<line class="eye" x1="26.2" y1="58" x2="26.2" y2="62.1"/><line class="eye" x1="46.1" y1="58" x2="46.1" y2="62.1"/><path class="mouth" d="M37,70.5q2.6,1.8,5.2,0"/>',
    tired:'<path class="eye" style="stroke-width:1.6" d="M23.8,60.6h4.8M43.7,60.6h4.8"/><path class="mouth" d="M37,71h5.2"/>',
    hurt:'<path class="eye" style="stroke-width:1.6" d="M24,57.4l3.6,2.4l-3.6,2.4M48.3,57.4l-3.6,2.4l3.6,2.4"/><path class="mouth" d="M35.6,71.4q1.4,-1.6,2.8,0t2.8,0t2.8,0"/>',
    happy:'<path class="eye" style="stroke-width:1.6" d="M23.8,61q2.4,-3,4.8,0M43.7,61q2.4,-3,4.8,0"/><path class="mouth" d="M36.4,69.6q3.2,3.4,6.4,0"/>'
  }[mode];
  $('face').innerHTML=f;
}

let happyUntil=0;
function render(){
  $('clock').textContent=fmt(S.elapsed);
  $('clockLab').textContent=S.focusing?'专注中':'已暂停';
  const fb=$('focusBtn');fb.textContent=S.focusing?'暂停':'开始专注';fb.classList.toggle('off',S.focusing);
  $('sp1').setAttribute('aria-pressed',S.speed===1);$('sp60').setAttribute('aria-pressed',S.speed===60);
  $('footNote').textContent=S.speed===60?'1 秒 = 1 分钟':'';
  let max=0,maxZ=null;
  ZONES.forEach(z=>{
    const p=S.pain[z.id];if(p>max){max=p;maxZ=z}
    const e=zoneEls[z.id];e.pc.textContent=Math.round(p)+'%';e.pc.classList.toggle('hot',p>=60);e.bar.style.width=p+'%';e.b.classList.toggle('hot',p>=60);
    const op=Math.min(1,p/100*1.1);
    (z.id==='arms'?['g-arms-l','g-arms-r']:['g-'+z.id]).forEach(g=>$(g).setAttribute('opacity',op.toFixed(2)));
    const s=$('s-'+z.id);s.setAttribute('opacity',p<35?0:Math.min(1,(p-35)/40).toFixed(2));s.classList.toggle('live',p>=70);
  });
  NEEDS.forEach(n=>{const e=needEls[n.id];e.em.textContent=ago(S.need[n.id])+'前';e.b.classList.toggle('due',S.need[n.id]>=n.min*60)});
  const happy=performance.now()<happyUntil;
  setFace(happy?'happy':max>=70?'hurt':max>=40?'tired':'calm');
  $('sweat').setAttribute('opacity',!happy&&max>=70?1:0);
  $('fig').classList.toggle('shake',!happy&&max>=85);
  $('fig').classList.toggle('happy',happy);
  const a=$('alert');
  if(max>=60&&!happy){
    a.hidden=false;a.classList.toggle('bad',max>=85);
    $('alertT').textContent=max>=85?`${maxZ.nm}疼得不行`:`${maxZ.nm}疼了`;
    $('alertS').textContent='';
    a.dataset.z=maxZ.id;
  } else a.hidden=true;
  if(max>=60&&!alerted&&S.focusing){alerted=true;try{navigator.vibrate&&navigator.vibrate([200,120,200])}catch(e){}}
  if(max<60)alerted=false;
}
let alerted=false;

$('focusBtn').onclick=()=>{S.focusing=!S.focusing;if(S.sample&&S.focusing)S.sample=false;render()};
$('sp1').onclick=()=>{S.speed=1;render()};
$('sp60').onclick=()=>{S.speed=60;render()};
$('reset').onclick=()=>{S={sample:false,focusing:false,speed:S.speed,elapsed:0,pain:{neck:0,waist:0,arms:0,chest:0},need:{water:0,wc:0,food:0},note:''};render()};
$('alertGo').onclick=()=>openEx(ZONES.find(z=>z.id===$('alert').dataset.z));

/* ---------- exercise ---------- */
let cur=null,det=null,reps=0,startPain=0,running=false,gotMotion=false,lastRepT=0;
const C=263.9;
function openEx(z){
  cur=z;reps=0;startPain=Math.max(1,S.pain[z.id]);running=false;
  $('exTag').textContent=z.nm;$('exName').textContent=z.ex;$('exZone').textContent=z.nm;
  $('exSteps').innerHTML=z.steps.map(s=>`<li>${s}</li>`).join('');
  $('repT').textContent='/ '+z.reps;$('noteIn').value=S.note||'';
  $('fallback').hidden=true;$('backCard').hidden=true;$('exStart').hidden=false;$('exStart').textContent='开始';
  status('点开始','','');
  updEx(0);document.body.style.overflow='hidden';$('sheet').hidden=false;
}
function closeEx(){
  stopMotion();$('sheet').hidden=true;document.body.style.overflow='';
  S.note=$('noteIn').value.trim();cur=null;render();
}
$('exClose').onclick=closeEx;
function status(t,cls,sub){const s=$('exStatus');s.textContent=t;s.className='status '+(cls||'');if(sub!=null)$('exSub').textContent=sub}
function updEx(prog){
  $('repN').textContent=reps;
  const frac=Math.min(1,(reps+Math.max(0,Math.min(1,prog||0)))/cur.reps);
  $('ringFg').setAttribute('stroke-dashoffset',(C*(1-frac)).toFixed(1));
  const p=S.pain[cur.id];$('exBar').style.width=p+'%';$('exPc').textContent=Math.round(p)+'%';
}
function rep(){
  if(!cur||reps>=cur.reps)return;
  const now=performance.now();
  if(now-lastRepT<cur.gap){slow();return}
  lastRepT=now;reps++;
  S.pain[cur.id]=Math.max(0,startPain*(1-reps/cur.reps));
  if(reps>=cur.reps){
    S.pain[cur.id]=0;buzz('done');status('完成','done','');
    stopMotion();happyUntil=performance.now()+2500;$('exStart').hidden=true;
    const n=$('noteIn').value.trim();if(n){$('backTxt').textContent=n;$('backCard').hidden=false}
  } else{buzz('ok');status('','','')}
  updEx(0);render();
}
$('simRep').onclick=()=>{lastRepT=0;rep()};

/* ---------- haptics: Android=vibrate, iPhone=switch tick + tone ---------- */
const PAT={ok:[40],side:[30,190,30],slow:[40,40,40,40,40],go:[120],done:[500]};
const TICK={ok:[0],side:[0,220],slow:[0,70,140],go:[0,70],done:[0,130,260,390]};
const TONE={ok:[[880,.06]],side:[[660,.05],[660,.05]],slow:[[220,.18]],go:[[520,.12]],done:[[660,.08],[880,.08],[1100,.22]]};
const hasVib=typeof navigator.vibrate==='function';
const sw=document.createElement('label');sw.style.cssText='position:fixed;left:-99px;top:0;opacity:0;pointer-events:none';
sw.innerHTML='<input type="checkbox" switch>';document.body.appendChild(sw);
function wav(tones){
  const sr=16000,segs=tones.map(([f,d])=>[f,Math.floor(sr*d),Math.floor(sr*.05)]),n=segs.reduce((t,x)=>t+x[1]+x[2],0);
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let p=44;segs.forEach(([f,len,g])=>{for(let i=0;i<len;i++){v.setInt16(p,Math.sin(2*Math.PI*f*i/sr)*Math.min(1,i/80,(len-i)/80)*16000,true);p+=2}p+=g*2});
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
const AU={};Object.keys(TONE).forEach(k=>{const a=new Audio(wav(TONE[k]));a.preload='auto';AU[k]=a});
function unlock(){Object.values(AU).forEach(a=>{a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})})}
function buzz(k){
  if(hasVib){try{navigator.vibrate(PAT[k])}catch(e){}return}
  TICK[k].forEach(t=>setTimeout(()=>{try{sw.click()}catch(e){}},t));
  const a=AU[k];if(a){try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
}
let lastSlow=0,armAt=0;
function slow(){const n=performance.now();if(n-lastSlow<900)return;lastSlow=n;buzz('slow');status('慢一点','slow','')}

/* ---------- motion detection ---------- */
const M={g:null,lastT:0};
const v3={dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],len:a=>Math.hypot(a[0],a[1],a[2])};
const deg=r=>r*180/Math.PI;
function ang(a,b){return deg(Math.acos(Math.max(-1,Math.min(1,v3.dot(a,b)))))}
const DET={
  raise(){return{base:null,up:false,lock:false,t0:0,update(s){
    if(!this.base){this.base=s.gn.slice();return 0}
    const a=ang(s.gn,this.base);
    if(a<20)this.t0=0;else if(!this.t0)this.t0=s.now;
    if(a<35)this.lock=false;
    if(!this.up&&!this.lock&&a>110){
      if(s.now-this.t0<800){this.lock=true;slow()}
      else{this.up=true;buzz('side');status('放下','','')}
    } else if(this.up&&a<35){this.up=false;rep()}
    return this.up?0.5+0.5*Math.min(1,(110-a)/75):0.5*Math.min(1,a/110);
  }}},
  circle(){return{prev:null,A:[0,0,0],acc:0,idle:0,update(s){
    if(this.prev){
      const p=this.prev,g=s.gn,d=ang(g,p),sp=d/s.dt;
      if(sp>540)slow();
      else if(sp>40){
        this.idle=0;
        const c=[p[1]*g[2]-p[2]*g[1],p[2]*g[0]-p[0]*g[2],p[0]*g[1]-p[1]*g[0]],cl=v3.len(c)||1,cu=c.map(x=>x/cl);
        const sg=v3.len(this.A)>0.2?Math.sign(v3.dot(cu,this.A)):1;
        this.acc+=sg*d;
        for(let i=0;i<3;i++)this.A[i]=this.A[i]*0.97+cu[i]*0.03;
      } else if((this.idle+=s.dt)>1.5)this.acc=0;
      if(Math.abs(this.acc)>=330){this.acc=0;this.A=[0,0,0];rep()}
    }
    this.prev=s.gn.slice();return Math.min(1,Math.abs(this.acc)/330);
  }}},
  yaw(){return{yaw:0,turn:0,ext:0,dir:0,tT:0,half:0,update(s){
    const r=s.rr,rate=r[0]*s.gn[0]+r[1]*s.gn[1]+r[2]*s.gn[2];
    if(Math.abs(rate)>6)this.yaw+=rate*s.dt;
    const y=this.yaw;
    const reverse=()=>{const amp=Math.abs(this.ext-this.turn),dur=s.now-this.tT;
      if(amp>55&&dur>450){this.half++;if(this.half%2===0)rep();else{buzz('side');status('收回','','')}}
      else if(amp>55)slow();
      this.turn=this.ext;this.tT=s.now;this.dir=-this.dir;this.ext=y};
    if(this.dir===0){if(!this.tT)this.tT=s.now;if(y-this.turn>10){this.dir=1;this.ext=y}else if(y-this.turn<-10){this.dir=-1;this.ext=y}}
    else if(this.dir===1){if(y>this.ext)this.ext=y;else if(this.ext-y>15)reverse()}
    else{if(y<this.ext)this.ext=y;else if(y-this.ext>15)reverse()}
    return (this.half%2)*0.5+0.5*Math.min(1,Math.abs(this.ext-this.turn)/55);
  }}},
  tilt(){return{last:0,half:0,tS:0,pend:0,pT:0,update(s){
    const x=s.gn[0],side=x>0.45?1:x<-0.45?-1:0;
    if(side!==this.pend){this.pend=side;this.pT=s.now}
    if(side!==0&&side!==this.last&&s.now-this.pT>250){
      if(this.tS&&s.now-this.tS<600)slow();
      else{this.half++;this.last=side;this.tS=s.now;if(this.half%2===0)rep();else{buzz('side');status('换边','','')}}
    }
    return (this.half%2)*0.5+0.5*Math.min(1,Math.abs(x)/0.45);
  }}}
};
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  gotMotion=true;if(!running)return;
  const now=performance.now(),dt=M.lastT?Math.min(0.1,Math.max(0.005,(now-M.lastT)/1000)):0.016;M.lastT=now;
  const v=[a.x,a.y,a.z];
  if(!M.g)M.g=v.slice();else for(let i=0;i<3;i++)M.g[i]+=(v[i]-M.g[i])*0.18;
  const n=v3.len(M.g)||1,gn=M.g.map(x=>x/n);
  if(armAt){if(now<armAt)return;armAt=0;det=DET[cur.det]();buzz('go');status('开始','','')}
  if(!det)return;
  const r=e.rotationRate||{};
  const prog=det.update({gn,rr:[r.beta||0,r.gamma||0,r.alpha||0],dt,now});
  if(cur)updEx(prog);
}
function stopMotion(){running=false;armAt=0;det=null;window.removeEventListener('devicemotion',onMotion)}
$('exStart').onclick=async()=>{
  if(!cur)return;unlock();
  try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')throw 0}}catch(e){}
  window.removeEventListener('devicemotion',onMotion);
  M.g=null;M.lastT=0;det=null;gotMotion=false;running=true;lastRepT=0;lastSlow=0;reps=0;updEx(0);
  armAt=performance.now()+2500;
  window.addEventListener('devicemotion',onMotion);
  $('exStart').textContent='重来';status('准备','','');
  setTimeout(()=>{if(running&&!gotMotion){$('fallback').hidden=false;status('无传感器','slow','')}},1500);
};

render();
})();
</script>
